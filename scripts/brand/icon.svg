<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#3b2f8f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="barOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- histogram: tails grey, certainty band teal -->
  <g>
    <rect x="86"  y="352" width="34" height="56"  rx="6" fill="url(#barOut)"/>
    <rect x="128" y="300" width="34" height="108" rx="6" fill="url(#bar)"/>
    <rect x="170" y="226" width="34" height="182" rx="6" fill="url(#bar)"/>
    <rect x="212" y="160" width="34" height="248" rx="6" fill="url(#bar)"/>
    <rect x="254" y="140" width="34" height="268" rx="6" fill="url(#bar)"/>
    <rect x="296" y="182" width="34" height="226" rx="6" fill="url(#bar)"/>
    <rect x="338" y="258" width="34" height="150" rx="6" fill="url(#bar)"/>
    <rect x="380" y="330" width="34" height="78"  rx="6" fill="url(#barOut)"/>
  </g>
  <!-- density curve -->
  <path d="M72 404 C150 400 170 300 205 210 C228 150 250 118 271 118 C292 118 316 150 338 214 C370 304 390 400 446 404"
        fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <!-- certainty bounds -->
  <path d="M124 96 V420 M418 96 V420" stroke="#fbbf24" stroke-width="8" stroke-dasharray="18 14" stroke-linecap="round"/>
</svg>
